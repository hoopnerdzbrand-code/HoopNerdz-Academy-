<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HoopNerdz" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>HoopNerdz Academy</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0a; --card: #111; --border: #222;
      --gold: #f5c518; --red: #e03030; --blue: #4a90d9;
      --white: #f0f0f0; --muted: #666; --green: #3ab57a;
      --orange: #ff8c00;
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--white); font-family: 'DM Sans', sans-serif; overscroll-behavior: none; }
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding-top: var(--safe-top); }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 12px; border-bottom: 2px solid var(--gold); flex-shrink: 0; }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--gold); letter-spacing: 2px; line-height: 1; }
    .logo em { color: var(--white); font-style: normal; }
    .logo small { color: var(--blue); font-size: 13px; display: block; letter-spacing: 3px; line-height: 1; }
    .content { flex: 1; overflow-y: auto; padding: 16px 16px calc(80px + var(--safe-bottom)); -webkit-overflow-scrolling: touch; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0d0d0d; border-top: 1px solid var(--border); display: flex; padding-bottom: var(--safe-bottom); z-index: 50; }
    .bottom-nav button { flex: 1; background: none; border: none; color: var(--muted); padding: 12px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; cursor: pointer; transition: color 0.15s; }
    .bottom-nav button.active { color: var(--gold); }
    .bottom-nav button svg { width: 22px; height: 22px; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
    .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 4px; }
    .stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 34px; line-height: 1; }
    .gold { color: var(--gold); } .red { color: var(--red); } .blue { color: var(--blue); } .green { color: var(--green); }
    .section-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; margin-top: 4px; }
    .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; color: var(--gold); }
    .btn { border: none; border-radius: 8px; padding: 9px 16px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 13px; transition: all 0.15s; }
    .btn-gold { background: var(--gold); color: #000; }
    .btn-red { background: var(--red); color: #fff; }
    .btn-outline { background: none; border: 1px solid var(--border); color: var(--white); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .pkg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .pkg-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 8px; text-align: center; }
    .pkg-name { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
    .pkg-price { font-family: 'Bebas Neue', sans-serif; font-size: 30px; color: var(--red); }
    .pkg-count { font-size: 12px; color: var(--muted); }
    .pkg-count b { color: var(--white); }
    .level-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .level-chip { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 8px; text-align: center; }
    .level-chip-count { font-family: 'Bebas Neue', sans-serif; font-size: 28px; }
    .level-chip-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .session-list { display: flex; flex-direction: column; gap: 8px; }
    .session-item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
    .session-name { font-weight: 600; font-size: 14px; }
    .session-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .session-date { font-size: 12px; color: var(--muted); white-space: nowrap; margin-left: 8px; }
    .player-list { display: flex; flex-direction: column; gap: 8px; }
    .player-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: background 0.15s; }
    .player-card:active { background: #1a1a1a; }
    .player-name { font-weight: 600; font-size: 15px; }
    .player-sub { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge-beginner { background: #1a3a2a; color: var(--green); }
    .badge-intermediate { background: #1a2a3a; color: var(--blue); }
    .badge-advanced { background: #3a1a1a; color: var(--red); }
    .pip-bar { display: flex; gap: 3px; align-items: center; margin-top: 8px; }
    .pip { width: 10px; height: 10px; border-radius: 2px; }
    .pip-used { background: var(--green); }
    .pip-rem { background: var(--border); }
    .sessions-right { text-align: right; }
    .sessions-remaining { font-family: 'Bebas Neue', sans-serif; font-size: 22px; }
    .back-btn { display: flex; align-items: center; gap: 6px; background: none; border: none; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 14px; cursor: pointer; margin-bottom: 14px; padding: 0; }
    .detail-name { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--white); margin-bottom: 4px; }
    .detail-meta { color: var(--muted); font-size: 13px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .detail-stat { background: #0d0d0d; border-radius: 10px; padding: 12px; text-align: center; }
    .detail-stat-val { font-family: 'Bebas Neue', sans-serif; font-size: 30px; }
    .detail-stat-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 5px; }
    .form-input { width: 100%; background: #0d0d0d; border: 1px solid var(--border); border-radius: 8px; padding: 11px 12px; color: var(--white); font-family: 'DM Sans', sans-serif; font-size: 16px; outline: none; appearance: none; -webkit-appearance: none; }
    .form-input:focus { border-color: var(--gold); }
    .form-input option { background: #0d0d0d; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    textarea.form-input { resize: vertical; min-height: 80px; font-size: 14px; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; display: flex; align-items: flex-end; padding-bottom: var(--safe-bottom); }
    .modal { background: #161616; border: 1px solid var(--border); border-radius: 20px 20px 0 0; padding: 24px 20px; width: 100%; max-height: 90vh; overflow-y: auto; animation: slideUp 0.25s ease; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--gold); margin-bottom: 18px; letter-spacing: 1px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .empty { text-align: center; padding: 48px 20px; color: var(--muted); font-size: 14px; }
    .empty-icon { font-size: 40px; margin-bottom: 10px; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
    .alert-banner { border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .alert-orange { background: #2a1800; border: 1px solid var(--orange); color: var(--orange); }
    .alert-red { background: #2a0000; border: 1px solid var(--red); color: #ff6666; }
    .renew-badge { background: #3a1a00; color: var(--orange); padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; }

    /* PAUSE BANNER */
    .pause-banner { background: #2a0000; border: 2px solid var(--red); border-radius: 14px; padding: 16px; margin-bottom: 16px; text-align: center; }
    .pause-banner-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--red); letter-spacing: 2px; margin-bottom: 4px; }
    .pause-banner-sub { font-size: 12px; color: #ff6666; margin-bottom: 12px; }

    /* MASTER TOGGLE */
    .master-toggle { display: flex; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    .master-toggle-label { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; }
    .master-toggle-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .toggle-switch { position: relative; width: 52px; height: 28px; flex-shrink: 0; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; inset: 0; background: var(--border); border-radius: 28px; cursor: pointer; transition: 0.3s; }
    .toggle-slider:before { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: 0.3s; }
    input:checked + .toggle-slider { background: var(--green); }
    input:checked + .toggle-slider:before { transform: translateX(24px); }
    input.paused + .toggle-slider { background: var(--red); }

    /* SCHEDULE GRID */
    .schedule-wrap { overflow-x: auto; margin-bottom: 16px; }
    .schedule-table { width: 100%; border-collapse: collapse; min-width: 340px; }
    .schedule-table th { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: center; }
    .schedule-table td { padding: 5px 6px; border-bottom: 1px solid var(--border); text-align: center; font-size: 12px; }
    .slot-cell { border-radius: 6px; padding: 5px 4px; display: block; width: 100%; font-weight: 600; font-size: 11px; cursor: pointer; border: none; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
    .slot-open { background: #0a2a15; color: var(--green); }
    .slot-warn { background: #2a1800; color: var(--orange); }
    .slot-full { background: #1a1a1a; color: var(--muted); cursor: default; }
    .slot-closed { background: #2a0000; color: var(--red); }
    .slot-paused { background: #1a1a1a; color: #444; cursor: default; }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo">HOOP<em>NERDZ</em><small>ACADEMY</small></div>
    <div id="header-action"></div>
  </div>
  <div class="content" id="content"></div>
  <nav class="bottom-nav">
    <button onclick="navigate('dashboard')" id="nav-dashboard" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </button>
    <button onclick="navigate('players')" id="nav-players">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/></svg>
      Players
    </button>
    <button onclick="navigate('sessions')" id="nav-sessions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
      Sessions
    </button>
    <button onclick="navigate('schedule')" id="nav-schedule">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Schedule
    </button>
  </nav>
</div>

<script>
  const PACKAGES = [
    { name: "1 Session", sessions: 1, price: 40 },
    { name: "4 Sessions", sessions: 4, price: 140 },
    { name: "6 Sessions", sessions: 6, price: 200 },
  ];
  const DAY_HOURS = ["9:00–10:00AM", "10:00–11:00AM", "11:00AM–12:00PM"];
  const LATE_HOURS = ["5:00–6:00PM", "6:00–7:00PM", "7:00–8:00PM"];
  const DAY_DAYS = ["Mon", "Tue", "Wed", "Thu"];
  const LATE_DAYS = ["Tue", "Wed", "Thu"];
  const MAX_PER_SLOT = 8;
  const LEVELS = ["Beginner", "Intermediate", "Advanced"];
  const LEVEL_COLORS = { Beginner: "var(--green)", Intermediate: "var(--blue)", Advanced: "var(--red)" };

  function load() {
    return {
      players: JSON.parse(localStorage.getItem("hn_players") || "[]"),
      sessions: JSON.parse(localStorage.getItem("hn_sessions") || "[]"),
      closedSlots: JSON.parse(localStorage.getItem("hn_closed") || "[]"),
      allPaused: JSON.parse(localStorage.getItem("hn_paused") || "false"),
    };
  }
  function persist() {
    localStorage.setItem("hn_players", JSON.stringify(players));
    localStorage.setItem("hn_sessions", JSON.stringify(sessions));
    localStorage.setItem("hn_closed", JSON.stringify(closedSlots));
    localStorage.setItem("hn_paused", JSON.stringify(allPaused));
  }
  let { players, sessions, closedSlots, allPaused } = load();

  function fmtDate(d) { return new Date(d).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); }
  function slotCount(key) { return sessions.filter(s => s.slotKey === key).length; }
  function isSlotClosed(key) { return closedSlots.includes(key); }

  function slotStatus(key) {
    if (allPaused) return "paused";
    if (isSlotClosed(key)) return "closed";
    const count = slotCount(key);
    if (count >= MAX_PER_SLOT) return "full";
    if (count >= MAX_PER_SLOT - 2) return "warn";
    return "open";
  }

  function toggleSlot(key) {
    if (allPaused) return;
    if (closedSlots.includes(key)) {
      closedSlots = closedSlots.filter(k => k !== key);
    } else {
      closedSlots.push(key);
    }
    persist();
    render();
  }

  function toggleAllPaused() {
    allPaused = !allPaused;
    persist();
    render();
  }

  function buildSlotOptions() {
    const opts = [];
    DAY_DAYS.forEach(day => {
      DAY_HOURS.forEach(hour => {
        const key = `Day|${day}|${hour}`;
        const status = slotStatus(key);
        const count = slotCount(key);
        opts.push({ key, label: `Day · ${day} · ${hour}`, count, status, avail: MAX_PER_SLOT - count });
      });
    });
    LATE_DAYS.forEach(day => {
      LATE_HOURS.forEach(hour => {
        const key = `Late|${day}|${hour}`;
        const status = slotStatus(key);
        const count = slotCount(key);
        opts.push({ key, label: `Late · ${day} · ${hour}`, count, status, avail: MAX_PER_SLOT - count });
      });
    });
    return opts;
  }

  let currentTab = "dashboard";
  let selectedPlayerId = null;

  function navigate(tab, playerId = null) {
    currentTab = tab; selectedPlayerId = playerId;
    document.querySelectorAll(".bottom-nav button").forEach(b => b.classList.remove("active"));
    document.getElementById("nav-" + tab)?.classList.add("active");
    render();
  }

  function render() {
    const content = document.getElementById("content");
    const headerAction = document.getElementById("header-action");
    headerAction.innerHTML = "";
    if (currentTab === "dashboard") renderDashboard(content);
    else if (currentTab === "players" && selectedPlayerId) renderPlayerDetail(content, selectedPlayerId);
    else if (currentTab === "players") renderPlayers(content, headerAction);
    else if (currentTab === "sessions") renderSessions(content, headerAction);
    else if (currentTab === "schedule") renderSchedule(content);
  }

  function renderDashboard(el) {
    const totalRevenue = players.reduce((s, p) => s + PACKAGES[p.package].price, 0);
    const pkgBreak = PACKAGES.map((pkg, i) => ({ ...pkg, count: players.filter(p => p.package === i).length }));
    const lvlBreak = LEVELS.map(lvl => ({ lvl, count: players.filter(p => p.level === lvl).length }));
    const needRenew = players.filter(p => p.sessionsRemaining === 0);
    const slots = buildSlotOptions();
    const fullSlots = slots.filter(s => s.status === "full").length;
    const closedCount = closedSlots.length;
    const recentSessions = [...sessions].reverse().slice(0, 5);

    el.innerHTML = `
      ${allPaused ? `<div class="pause-banner">
        <div class="pause-banner-title">🚫 ALL SESSIONS PAUSED</div>
        <div class="pause-banner-sub">Registration is blocked. Go to Schedule to reopen.</div>
        <button class="btn btn-gold btn-sm" onclick="navigate('schedule')">Manage Schedule</button>
      </div>` : ""}
      ${needRenew.length > 0 ? `<div class="alert-banner alert-orange">🔔 <b>${needRenew.length} player${needRenew.length > 1 ? "s" : ""} out of sessions</b> — time to renew!</div>` : ""}
      ${fullSlots > 0 && !allPaused ? `<div class="alert-banner alert-red">🚫 <b>${fullSlots} slot${fullSlots > 1 ? "s" : ""} full</b> — at 8 player max</div>` : ""}
      ${closedCount > 0 && !allPaused ? `<div class="alert-banner" style="background:#1a1200;border:1px solid #888;color:#aaa">🔒 <b>${closedCount} slot${closedCount > 1 ? "s" : ""} manually closed</b></div>` : ""}

      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Total Revenue</div><div class="stat-value gold">$${totalRevenue.toLocaleString()}</div></div>
        <div class="stat-card"><div class="stat-label">Players</div><div class="stat-value blue">${players.length}</div></div>
        <div class="stat-card"><div class="stat-label">Sessions Logged</div><div class="stat-value green">${sessions.length}</div></div>
        <div class="stat-card"><div class="stat-label">Avg / Player</div><div class="stat-value red">$${players.length ? Math.round(totalRevenue / players.length) : 0}</div></div>
      </div>

      <div class="section-hd"><div class="section-title">Packages Sold</div></div>
      <div class="pkg-grid">
        ${pkgBreak.map(pkg => `<div class="pkg-card"><div class="pkg-name">${pkg.name}</div><div class="pkg-price">$${pkg.price}</div><div class="pkg-count"><b>${pkg.count}</b> sold</div></div>`).join("")}
      </div>

      <div class="section-hd"><div class="section-title">Skill Levels</div></div>
      <div class="level-row">
        ${lvlBreak.map(({ lvl, count }) => `<div class="level-chip"><div class="level-chip-count" style="color:${LEVEL_COLORS[lvl]}">${count}</div><div class="level-chip-label">${lvl}</div></div>`).join("")}
      </div>

      <div class="section-hd"><div class="section-title">Recent Sessions</div></div>
      <div class="session-list">
        ${recentSessions.length === 0 ? `<div class="empty"><div class="empty-icon">🏀</div>No sessions yet</div>` :
          recentSessions.map(s => `<div class="session-item">
            <div><div class="session-name">${s.playerName}</div><div class="session-meta">${s.slotKey ? s.slotKey.replace(/\|/g," · ") : s.type}${s.notes ? " · " + s.notes : ""}</div></div>
            <div class="session-date">${fmtDate(s.date)}</div>
          </div>`).join("")}
      </div>
    `;
  }

  function renderPlayers(el, headerAction) {
    headerAction.innerHTML = `<div style="display:flex;gap:8px">
      <button class="btn btn-outline btn-sm" onclick="openLogSession()">+ Session</button>
      <button class="btn btn-gold btn-sm" onclick="openAddPlayer()">+ Player</button>
    </div>`;
    el.innerHTML = `<div class="player-list">
      ${players.length === 0 ? `<div class="empty"><div class="empty-icon">👟</div>No players yet. Add your first one!</div>` :
        players.map(p => {
          const pkg = PACKAGES[p.package];
          const pips = Array.from({ length: pkg.sessions }, (_, i) => `<div class="pip ${i < p.sessionsAttended ? "pip-used" : "pip-rem"}"></div>`).join("");
          return `<div class="player-card" onclick="navigate('players', ${p.id})">
            <div>
              <div class="player-name">${p.name}${p.age ? `<span style="color:var(--muted);font-weight:400;font-size:12px;margin-left:6px">Age ${p.age}</span>` : ""}</div>
              <div class="player-sub">
                <span class="badge badge-${p.level.toLowerCase()}">${p.level}</span>
                ${p.sessionsRemaining === 0 ? `<span class="renew-badge">Needs Renewal</span>` : ""}
              </div>
              <div class="pip-bar">${pips}</div>
            </div>
            <div class="sessions-right">
              <div class="sessions-remaining" style="color:${p.sessionsRemaining === 0 ? "var(--red)" : "var(--green)"}">${p.sessionsRemaining}</div>
              <div style="font-size:11px;color:var(--muted)">left</div>
            </div>
          </div>`;
        }).join("")}
    </div>`;
  }

  function renderPlayerDetail(el, playerId) {
    const p = players.find(pl => pl.id === playerId);
    if (!p) { navigate("players"); return; }
    const pkg = PACKAGES[p.package];
    const playerSessions = [...sessions].filter(s => s.playerId === p.id).reverse();
    el.innerHTML = `
      <button class="back-btn" onclick="navigate('players')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>All Players
      </button>
      <div class="detail-name">${p.name}</div>
      <div class="detail-meta">
        ${p.age ? `<span>Age ${p.age}</span>` : ""}
        <span class="badge badge-${p.level.toLowerCase()}">${p.level}</span>
        <span style="color:var(--gold)">${pkg.name} · $${pkg.price}</span>
        ${p.sessionsRemaining === 0 ? `<span class="renew-badge">Needs Renewal</span>` : ""}
      </div>
      <div class="detail-grid">
        <div class="detail-stat"><div class="detail-stat-val green">${p.sessionsAttended}</div><div class="detail-stat-lbl">Attended</div></div>
        <div class="detail-stat"><div class="detail-stat-val ${p.sessionsRemaining === 0 ? "red" : "blue"}">${p.sessionsRemaining}</div><div class="detail-stat-lbl">Remaining</div></div>
        <div class="detail-stat"><div class="detail-stat-val gold">${pkg.sessions}</div><div class="detail-stat-lbl">Purchased</div></div>
      </div>
      <div class="form-group">
        <label class="form-label">Coaching Notes</label>
        <textarea class="form-input" id="notes-${p.id}" placeholder="Ball handling, attitude, areas to improve...">${p.notes || ""}</textarea>
        <button class="btn btn-outline btn-sm" style="margin-top:8px;width:100%" onclick="saveNotes(${p.id})">Save Notes</button>
      </div>
      ${playerSessions.length > 0 ? `
        <hr class="divider">
        <div class="section-hd"><div class="section-title">Session History (${playerSessions.length})</div></div>
        <div class="session-list">
          ${playerSessions.map(s => `<div class="session-item">
            <div><div class="session-name">${s.slotKey ? s.slotKey.replace(/\|/g," · ") : s.type}</div>${s.notes ? `<div class="session-meta">${s.notes}</div>` : ""}</div>
            <div class="session-date">${fmtDate(s.date)}</div>
          </div>`).join("")}
        </div>` : ""}
    `;
  }

  function renderSessions(el, headerAction) {
    headerAction.innerHTML = `<button class="btn btn-gold btn-sm" onclick="openLogSession()">+ Log Session</button>`;
    const all = [...sessions].reverse();
    el.innerHTML = `<div class="session-list">
      ${all.length === 0 ? `<div class="empty"><div class="empty-icon">📋</div>No sessions logged yet.</div>` :
        all.map(s => `<div class="session-item">
          <div><div class="session-name">${s.playerName}</div><div class="session-meta">${s.slotKey ? s.slotKey.replace(/\|/g," · ") : s.type}${s.notes ? " · " + s.notes : ""}</div></div>
          <div class="session-date">${fmtDate(s.date)}</div>
        </div>`).join("")}
    </div>`;
  }

  function renderSchedule(el) {
    function slotBtn(key) {
      const status = slotStatus(key);
      const count = slotCount(key);
      const avail = MAX_PER_SLOT - count;
      const labels = {
        open: `${avail} open`,
        warn: `${avail} left`,
        full: "FULL",
        closed: "CLOSED 🔒",
        paused: "PAUSED"
      };
      const cls = `slot-${status}`;
      const clickable = status !== "full" && status !== "paused";
      return `<button class="slot-cell ${cls}" ${clickable ? `onclick="toggleSlot('${key}')"` : "disabled"}>${labels[status]}</button>`;
    }

    el.innerHTML = `
      <!-- MASTER PAUSE TOGGLE -->
      <div class="master-toggle">
        <div>
          <div class="master-toggle-label" style="color:${allPaused ? "var(--red)" : "var(--green)"}">${allPaused ? "🚫 ALL SESSIONS PAUSED" : "✅ SESSIONS OPEN"}</div>
          <div class="master-toggle-sub">${allPaused ? "Tap to reopen all sessions" : "Tap to pause all sessions"}</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" ${allPaused ? "" : "checked"} onchange="toggleAllPaused()" />
          <span class="toggle-slider"></span>
        </label>
      </div>

      ${allPaused ? "" : `
        <div style="font-size:12px;color:var(--muted);margin-bottom:12px">Tap any slot to open/close it individually.</div>

        <div class="section-hd"><div class="section-title">Day Sessions (9AM–12PM)</div></div>
        <div class="schedule-wrap">
          <table class="schedule-table">
            <thead><tr><th>Hour</th>${DAY_DAYS.map(d => `<th>${d}</th>`).join("")}</tr></thead>
            <tbody>
              ${DAY_HOURS.map(hour => `<tr>
                <td style="color:var(--muted);font-size:10px;white-space:nowrap;text-align:left;padding-left:2px">${hour}</td>
                ${DAY_DAYS.map(day => `<td>${slotBtn("Day|" + day + "|" + hour)}</td>`).join("")}
              </tr>`).join("")}
            </tbody>
          </table>
        </div>

        <div class="section-hd" style="margin-top:8px"><div class="section-title">Late Sessions (5PM–8PM)</div></div>
        <div class="schedule-wrap">
          <table class="schedule-table">
            <thead><tr><th>Hour</th>${LATE_DAYS.map(d => `<th>${d}</th>`).join("")}</tr></thead>
            <tbody>
              ${LATE_HOURS.map(hour => `<tr>
                <td style="color:var(--muted);font-size:10px;white-space:nowrap;text-align:left;padding-left:2px">${hour}</td>
                ${LATE_DAYS.map(day => `<td>${slotBtn("Late|" + day + "|" + hour)}</td>`).join("")}
              </tr>`).join("")}
            </tbody>
          </table>
        </div>

        <div style="display:flex;gap:10px;margin-top:12px;font-size:11px;color:var(--muted);flex-wrap:wrap">
          <span><span style="color:var(--green)">●</span> Open</span>
          <span><span style="color:var(--orange)">●</span> Almost Full</span>
          <span><span style="color:var(--muted)">●</span> Full</span>
          <span><span style="color:var(--red)">●</span> Closed (tap to reopen)</span>
        </div>
      `}
    `;
  }

  function saveNotes(id) {
    const val = document.getElementById("notes-" + id)?.value || "";
    players = players.map(p => p.id === id ? { ...p, notes: val } : p);
    persist();
    const btn = document.querySelector(`[onclick="saveNotes(${id})"]`);
    if (btn) { btn.textContent = "Saved ✓"; setTimeout(() => btn.textContent = "Save Notes", 1500); }
  }

  function openAddPlayer() {
    showModal(`
      <div class="modal-title">Add New Player</div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Name *</label><input class="form-input" id="m-name" placeholder="Full name" /></div>
        <div class="form-group"><label class="form-label">Age</label><input class="form-input" id="m-age" type="number" placeholder="Age" min="5" max="25" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Skill Level</label>
          <select class="form-input" id="m-level">${LEVELS.map(l => `<option>${l}</option>`).join("")}</select>
        </div>
        <div class="form-group"><label class="form-label">Package</label>
          <select class="form-input" id="m-pkg">${PACKAGES.map((pkg, i) => `<option value="${i}">${pkg.name} — $${pkg.price}</option>`).join("")}</select>
        </div>
      </div>
      <div class="form-group"><label class="form-label">Notes</label><input class="form-input" id="m-notes" placeholder="Goals, parent contact..." /></div>
      <div class="modal-actions">
        <button class="btn btn-gold" style="flex:1" onclick="submitAddPlayer()">Add Player</button>
        <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      </div>
    `);
    setTimeout(() => document.getElementById("m-name")?.focus(), 100);
  }

  function submitAddPlayer() {
    const name = document.getElementById("m-name")?.value.trim();
    if (!name) return;
    const pkgIdx = Number(document.getElementById("m-pkg")?.value || 0);
    const pkg = PACKAGES[pkgIdx];
    players.push({ id: Date.now(), name, age: document.getElementById("m-age")?.value || "", level: document.getElementById("m-level")?.value || "Beginner", package: pkgIdx, sessionsRemaining: pkg.sessions, sessionsAttended: 0, notes: document.getElementById("m-notes")?.value || "", joinDate: new Date().toISOString() });
    persist(); closeModal(); navigate("players");
  }

  function openLogSession() {
    const available = players.filter(p => p.sessionsRemaining > 0);
    const slots = buildSlotOptions().filter(s => s.status === "open" || s.status === "warn");
    const today = new Date().toISOString().split("T")[0];
    showModal(`
      <div class="modal-title">Log Session</div>
      ${allPaused ? `<div style="color:var(--red);font-size:13px;margin-bottom:12px">⚠️ All sessions are paused. Go to Schedule to reopen first.</div>` : ""}
      <div class="form-group"><label class="form-label">Player *</label>
        <select class="form-input" id="m-player">
          <option value="">Select player...</option>
          ${available.map(p => `<option value="${p.id}">${p.name} (${p.sessionsRemaining} left)</option>`).join("")}
        </select>
      </div>
      <div class="form-group"><label class="form-label">Time Slot *</label>
        <select class="form-input" id="m-slot">
          <option value="">Select slot...</option>
          ${slots.map(s => `<option value="${s.key}">${s.label} — ${s.avail} spots left</option>`).join("")}
          ${slots.length === 0 ? `<option disabled>No open slots available</option>` : ""}
        </select>
      </div>
      <div class="form-group"><label class="form-label">Date</label>
        <input class="form-input" id="m-date" type="date" value="${today}" />
      </div>
      <div class="form-group"><label class="form-label">Session Notes</label>
        <input class="form-input" id="m-snotes" placeholder="What did you work on?" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-gold" style="flex:1" onclick="submitLogSession()">Log It</button>
        <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      </div>
    `);
  }

  function submitLogSession() {
    const playerId = Number(document.getElementById("m-player")?.value);
    const slotKey = document.getElementById("m-slot")?.value;
    if (!playerId || !slotKey) return;
    const player = players.find(p => p.id === playerId);
    if (!player || player.sessionsRemaining <= 0) return;
    if (slotCount(slotKey) >= MAX_PER_SLOT) { alert("That slot is full. Pick another time."); return; }
    sessions.push({ id: Date.now(), playerId, playerName: player.name, slotKey, date: document.getElementById("m-date")?.value || new Date().toISOString().split("T")[0], notes: document.getElementById("m-snotes")?.value || "" });
    players = players.map(p => p.id === playerId ? { ...p, sessionsRemaining: p.sessionsRemaining - 1, sessionsAttended: p.sessionsAttended + 1 } : p);
    persist(); closeModal(); render();
  }

  function showModal(html) {
    closeModal();
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop"; backdrop.id = "modal-backdrop";
    backdrop.innerHTML = `<div class="modal">${html}</div>`;
    backdrop.addEventListener("click", e => { if (e.target === backdrop) closeModal(); });
    document.body.appendChild(backdrop);
  }
  function closeModal() { document.getElementById("modal-backdrop")?.remove(); }

  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(() => {}); }
  render();
</script>
</body>
</html>
