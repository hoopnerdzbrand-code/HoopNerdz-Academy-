<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HoopNerdz Academy — Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0a; --card: #111; --border: #222;
      --gold: #f5c518; --red: #e03030; --blue: #4a90d9;
      --white: #f0f0f0; --muted: #666; --green: #3ab57a; --orange: #ff8c00;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--white); font-family: 'DM Sans', sans-serif; min-height: 100vh; padding-bottom: 60px; }
    .hero { background: linear-gradient(180deg, #0f0f0f 0%, #0a0a0a 100%); border-bottom: 2px solid var(--gold); padding: 32px 20px 24px; text-align: center; }
    .hero-logo { font-family: 'Bebas Neue', sans-serif; font-size: 48px; color: var(--gold); letter-spacing: 4px; line-height: 1; }
    .hero-logo em { color: var(--white); font-style: normal; }
    .hero-sub { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--blue); letter-spacing: 4px; margin-bottom: 8px; }
    .hero-tagline { font-size: 13px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
    .hero-tagline span { color: var(--gold); }
    .container { max-width: 520px; margin: 0 auto; padding: 24px 16px; }
    .paused-screen { text-align: center; padding: 48px 20px; }
    .paused-icon { font-size: 64px; margin-bottom: 16px; }
    .paused-title { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--red); letter-spacing: 2px; margin-bottom: 8px; }
    .paused-sub { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
    .info-bar { background: #0d1520; border: 1px solid #1a3a5a; border-radius: 10px; padding: 12px 14px; font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 16px; }
    .info-bar b { color: var(--blue); }
    .pkg-section { margin-bottom: 24px; }
    .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--gold); letter-spacing: 1px; margin-bottom: 12px; }
    .pkg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .pkg-card { background: var(--card); border: 2px solid var(--border); border-radius: 12px; padding: 14px 8px; text-align: center; cursor: pointer; transition: all 0.15s; position: relative; }
    .pkg-card.selected { border-color: var(--gold); background: #1a1600; }
    .pkg-card.selected::after { content: "✓"; position: absolute; top: 8px; right: 10px; color: var(--gold); font-weight: 700; font-size: 14px; }
    .pkg-sessions { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
    .pkg-price { font-family: 'Bebas Neue', sans-serif; font-size: 34px; color: var(--red); line-height: 1.1; }
    .pkg-save { font-size: 11px; color: var(--green); font-weight: 600; margin-top: 2px; }
    .form-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
    .form-card-title { font-family: 'Bebas Neue', sans-serif; font-size: 17px; color: var(--gold); letter-spacing: 1px; margin-bottom: 14px; }
    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 5px; }
    .form-input { width: 100%; background: #0d0d0d; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; color: var(--white); font-family: 'DM Sans', sans-serif; font-size: 16px; outline: none; -webkit-appearance: none; appearance: none; }
    .form-input:focus { border-color: var(--gold); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .required { color: var(--red); }
    .error-msg { color: var(--red); font-size: 12px; margin-top: 4px; display: none; }
    .form-input.error { border-color: var(--red); }

    /* LEVEL CARDS */
    .level-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .level-card { background: #0d0d0d; border: 2px solid var(--border); border-radius: 10px; padding: 12px 8px; text-align: center; cursor: pointer; transition: all 0.15s; }
    .level-card.selected-beg { border-color: var(--green); background: #0d1f15; }
    .level-card.selected-int { border-color: var(--blue); background: #0d1525; }
    .level-card.selected-adv { border-color: var(--red); background: #1f0d0d; }
    .level-icon { font-size: 22px; margin-bottom: 4px; }
    .level-name { font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 0.5px; }
    .level-desc { font-size: 10px; color: var(--muted); margin-top: 2px; line-height: 1.3; }

    /* SLOT SECTION */
    .slot-section { display: none; }
    .slot-section.visible { display: block; }
    .slot-group { margin-bottom: 14px; }
    .slot-group-title { font-family: 'Bebas Neue', sans-serif; font-size: 14px; color: var(--gold); letter-spacing: 1px; margin-bottom: 8px; }
    .slot-list { display: flex; flex-direction: column; gap: 6px; }
    .slot-option { display: flex; align-items: center; justify-content: space-between; background: #0d0d0d; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; cursor: pointer; transition: all 0.15s; }
    .slot-option.available:hover { border-color: var(--gold); }
    .slot-option.selected { border-color: var(--gold); background: #1a1600; }
    .slot-option.unavailable { opacity: 0.45; cursor: not-allowed; }
    .slot-label { font-size: 14px; font-weight: 600; }
    .slot-day { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .slot-status { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 3px 8px; border-radius: 20px; white-space: nowrap; }
    .status-open { background: #0a2a15; color: var(--green); }
    .status-warn { background: #2a1800; color: var(--orange); }
    .status-full { background: #2a0000; color: var(--red); }
    .status-closed { background: #1a1a1a; color: #555; }

    /* LEVEL SCHEDULE PREVIEW */
    .level-schedule { border-radius: 10px; padding: 12px 14px; margin-top: 10px; font-size: 12px; line-height: 1.8; }
    .level-schedule-beg { background: #0d1f15; border: 1px solid var(--green); color: var(--green); }
    .level-schedule-int { background: #0d1525; border: 1px solid var(--blue); color: var(--blue); }
    .level-schedule-adv { background: #1f0d0d; border: 1px solid var(--red); color: var(--red); }

    /* PAYMENT */
    .payment-summary { background: #1a1600; border: 1px solid var(--gold); border-radius: 12px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .payment-summary-label { font-size: 13px; color: var(--muted); }
    .payment-summary-amount { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--gold); }
    .payment-summary-pkg { font-size: 12px; color: var(--white); }
    .payment-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pay-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 12px; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer; border: none; text-decoration: none; transition: all 0.15s; }
    .pay-venmo { background: #3D95CE; color: #fff; }
    .pay-cashapp { background: #00D632; color: #000; }
    .pay-icon { width: 22px; height: 22px; }
    .submit-btn { width: 100%; padding: 16px; background: var(--gold); color: #000; font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; border: none; border-radius: 12px; cursor: pointer; margin-top: 4px; }

    /* SUCCESS */
    .success-screen { display: none; text-align: center; padding: 40px 20px; }
    .success-icon { font-size: 64px; margin-bottom: 16px; }
    .success-title { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--gold); letter-spacing: 2px; margin-bottom: 8px; }
    .success-sub { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    .success-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: left; margin-bottom: 16px; }
    .success-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .success-row:last-child { border-bottom: none; }
    .success-row-label { color: var(--muted); }
    .success-row-val { font-weight: 600; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .badge-beginner { background: #1a3a2a; color: var(--green); }
    .badge-intermediate { background: #1a2a3a; color: var(--blue); }
    .badge-advanced { background: #3a1a1a; color: var(--red); }
  </style>
</head>
<body>

<div class="hero">
  <div class="hero-logo">HOOP<em>NERDZ</em></div>
  <div class="hero-sub">Academy</div>
  <div class="hero-tagline"><span>Training.</span> Development. <span>Results.</span></div>
</div>

<div class="container" id="main-container">
  <div style="text-align:center;padding:40px;color:#666">Loading...</div>
</div>

<div class="success-screen" id="success-screen">
  <div class="success-icon">🏀</div>
  <div class="success-title">You're Registered!</div>
  <div class="success-sub">Coach Mark will reach out to confirm your spot.<br>Send payment to lock it in.</div>
  <div class="success-card" id="success-summary"></div>
  <div class="payment-btns" style="margin-bottom:16px">
    <a id="success-venmo" href="#" class="pay-btn pay-venmo" target="_blank">Pay via Venmo</a>
    <a href="https://cash.app/$Nerdzbrand" class="pay-btn pay-cashapp" target="_blank">Pay via Cash App</a>
  </div>
  <div class="info-bar" style="text-align:left">
    📍 <b>5555 Littleflower Ave, Cincinnati OH 45237</b><br>
    📞 <b>513.549.7563</b> · 📸 @hoopnerdzacademy
  </div>
</div>

<script>
  const PACKAGES = [
    { name: "1 Session", sessions: 1, price: 40 },
    { name: "4 Sessions", sessions: 4, price: 140 },
    { name: "6 Sessions", sessions: 6, price: 200 },
  ];
  const MAX_PER_SLOT = 8;

  // Level → assigned slots (strict)
  // Day: Advanced 9-10, Intermediate 10-11, Beginner 11-12
  // Late: Beginner 5-6, Intermediate 6-7, Advanced 7-8
  const LEVEL_SLOTS = {
    Advanced: [
      { key: "Day|Mon|9:00–10:00AM",   label: "9:00–10:00AM",   type: "Day Session",  day: "Monday" },
      { key: "Day|Tue|9:00–10:00AM",   label: "9:00–10:00AM",   type: "Day Session",  day: "Tuesday" },
      { key: "Day|Wed|9:00–10:00AM",   label: "9:00–10:00AM",   type: "Day Session",  day: "Wednesday" },
      { key: "Day|Thu|9:00–10:00AM",   label: "9:00–10:00AM",   type: "Day Session",  day: "Thursday" },
      { key: "Late|Tue|7:00–8:00PM",   label: "7:00–8:00PM",    type: "Late Session", day: "Tuesday" },
      { key: "Late|Wed|7:00–8:00PM",   label: "7:00–8:00PM",    type: "Late Session", day: "Wednesday" },
      { key: "Late|Thu|7:00–8:00PM",   label: "7:00–8:00PM",    type: "Late Session", day: "Thursday" },
    ],
    Intermediate: [
      { key: "Day|Mon|10:00–11:00AM",  label: "10:00–11:00AM",  type: "Day Session",  day: "Monday" },
      { key: "Day|Tue|10:00–11:00AM",  label: "10:00–11:00AM",  type: "Day Session",  day: "Tuesday" },
      { key: "Day|Wed|10:00–11:00AM",  label: "10:00–11:00AM",  type: "Day Session",  day: "Wednesday" },
      { key: "Day|Thu|10:00–11:00AM",  label: "10:00–11:00AM",  type: "Day Session",  day: "Thursday" },
      { key: "Late|Tue|6:00–7:00PM",   label: "6:00–7:00PM",    type: "Late Session", day: "Tuesday" },
      { key: "Late|Wed|6:00–7:00PM",   label: "6:00–7:00PM",    type: "Late Session", day: "Wednesday" },
      { key: "Late|Thu|6:00–7:00PM",   label: "6:00–7:00PM",    type: "Late Session", day: "Thursday" },
    ],
    Beginner: [
      { key: "Day|Mon|11:00AM–12:00PM", label: "11:00AM–12:00PM", type: "Day Session",  day: "Monday" },
      { key: "Day|Tue|11:00AM–12:00PM", label: "11:00AM–12:00PM", type: "Day Session",  day: "Tuesday" },
      { key: "Day|Wed|11:00AM–12:00PM", label: "11:00AM–12:00PM", type: "Day Session",  day: "Wednesday" },
      { key: "Day|Thu|11:00AM–12:00PM", label: "11:00AM–12:00PM", type: "Day Session",  day: "Thursday" },
      { key: "Late|Tue|5:00–6:00PM",    label: "5:00–6:00PM",     type: "Late Session", day: "Tuesday" },
      { key: "Late|Wed|5:00–6:00PM",    label: "5:00–6:00PM",     type: "Late Session", day: "Wednesday" },
      { key: "Late|Thu|5:00–6:00PM",    label: "5:00–6:00PM",     type: "Late Session", day: "Thursday" },
    ],
  };

  const LEVEL_SCHEDULE_TEXT = {
    Advanced:     "☀️ Day: 9:00–10:00AM (Mon–Thu)\n🌙 Late: 7:00–8:00PM (Tue–Thu)",
    Intermediate: "☀️ Day: 10:00–11:00AM (Mon–Thu)\n🌙 Late: 6:00–7:00PM (Tue–Thu)",
    Beginner:     "☀️ Day: 11:00AM–12:00PM (Mon–Thu)\n🌙 Late: 5:00–6:00PM (Tue–Thu)",
  };

  let selectedPkg = null;
  let selectedLevel = null;
  let selectedSlot = null;

  function getStoredData() {
    return {
      sessions: JSON.parse(localStorage.getItem("hn_sessions") || "[]"),
      closedSlots: JSON.parse(localStorage.getItem("hn_closed") || "[]"),
      allPaused: JSON.parse(localStorage.getItem("hn_paused") || "false"),
    };
  }

  function slotCount(key) {
    return getStoredData().sessions.filter(s => s.slotKey === key).length;
  }

  function getSlotStatus(key) {
    const { closedSlots, allPaused } = getStoredData();
    if (allPaused) return "paused";
    if (closedSlots.includes(key)) return "closed";
    const count = slotCount(key);
    if (count >= MAX_PER_SLOT) return "full";
    if (count >= MAX_PER_SLOT - 2) return "warn";
    return "open";
  }

  function renderPage() {
    const { allPaused } = getStoredData();
    const container = document.getElementById("main-container");

    if (allPaused) {
      container.innerHTML = `
        <div class="paused-screen">
          <div class="paused-icon">🚫</div>
          <div class="paused-title">Sessions Currently Paused</div>
          <div class="paused-sub">Coach Mark has temporarily paused new registrations.<br>Check back soon or reach out directly.</div>
          <div class="info-bar">📞 <b>513.549.7563</b><br>📸 <b>@hoopnerdzacademy</b><br>📍 <b>5555 Littleflower Ave, Cincinnati OH 45237</b></div>
        </div>`;
      return;
    }

    container.innerHTML = `
      <!-- 1. PACKAGE -->
      <div class="pkg-section">
        <div class="section-title">1. Choose Your Package</div>
        <div class="pkg-grid">
          <div class="pkg-card" onclick="selectPkg(0)" id="pkg-0">
            <div class="pkg-sessions">1 Session</div><div class="pkg-price">$40</div><div class="pkg-save">&nbsp;</div>
          </div>
          <div class="pkg-card" onclick="selectPkg(1)" id="pkg-1">
            <div class="pkg-sessions">4 Sessions</div><div class="pkg-price">$140</div><div class="pkg-save">Save $20!</div>
          </div>
          <div class="pkg-card" onclick="selectPkg(2)" id="pkg-2">
            <div class="pkg-sessions">6 Sessions</div><div class="pkg-price">$200</div><div class="pkg-save">Save $40!</div>
          </div>
        </div>
      </div>

      <!-- 2. SKILL LEVEL -->
      <div class="pkg-section">
        <div class="section-title">2. Skill Level</div>
        <div class="level-grid">
          <div class="level-card" onclick="selectLevel('Beginner')" id="lvl-Beginner">
            <div class="level-icon">🟢</div>
            <div class="level-name" style="color:var(--green)">Beginner</div>
            <div class="level-desc">New to organized ball, ages 8–12</div>
          </div>
          <div class="level-card" onclick="selectLevel('Intermediate')" id="lvl-Intermediate">
            <div class="level-icon">🔵</div>
            <div class="level-name" style="color:var(--blue)">Intermediate</div>
            <div class="level-desc">Some experience, building IQ</div>
          </div>
          <div class="level-card" onclick="selectLevel('Advanced')" id="lvl-Advanced">
            <div class="level-icon">🔴</div>
            <div class="level-name" style="color:var(--red)">Advanced</div>
            <div class="level-desc">Varsity+ or serious player</div>
          </div>
        </div>
        <div id="level-schedule-preview" style="display:none"></div>
      </div>

      <!-- 3. SESSION SLOTS (shown after level selected) -->
      <div class="form-card slot-section" id="slot-section">
        <div class="form-card-title" id="slot-section-title">3. Pick Your Session</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:12px">Tap an available slot to select it.</div>
        <div class="slot-group">
          <div class="slot-group-title">☀️ Day Sessions</div>
          <div class="slot-list" id="day-slots"></div>
        </div>
        <div class="slot-group" style="margin-top:14px">
          <div class="slot-group-title">🌙 Late Sessions</div>
          <div class="slot-list" id="late-slots"></div>
        </div>
      </div>

      <!-- 4. PLAYER INFO -->
      <div class="form-card">
        <div class="form-card-title">4. Player Info</div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">First Name <span class="required">*</span></label>
            <input class="form-input" id="f-first" placeholder="First name" autocomplete="given-name" />
            <div class="error-msg" id="err-first">Required</div>
          </div>
          <div class="form-group">
            <label class="form-label">Last Name <span class="required">*</span></label>
            <input class="form-input" id="f-last" placeholder="Last name" autocomplete="family-name" />
            <div class="error-msg" id="err-last">Required</div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Age <span class="required">*</span></label>
            <input class="form-input" id="f-age" type="number" placeholder="Age" min="5" max="25" />
            <div class="error-msg" id="err-age">Required</div>
          </div>
          <div class="form-group">
            <label class="form-label">School / Team</label>
            <input class="form-input" id="f-school" placeholder="Optional" />
          </div>
        </div>
      </div>

      <!-- 5. PARENT INFO -->
      <div class="form-card">
        <div class="form-card-title">5. Parent / Guardian</div>
        <div class="form-group">
          <label class="form-label">Full Name <span class="required">*</span></label>
          <input class="form-input" id="f-parent" placeholder="Parent or guardian name" autocomplete="name" />
          <div class="error-msg" id="err-parent">Required</div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Phone <span class="required">*</span></label>
            <input class="form-input" id="f-phone" type="tel" placeholder="(513) 000-0000" autocomplete="tel" />
            <div class="error-msg" id="err-phone">Required</div>
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input class="form-input" id="f-email" type="email" placeholder="Optional" autocomplete="email" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Goals / Notes for Coach</label>
          <input class="form-input" id="f-notes" placeholder="What do you want to work on?" />
        </div>
      </div>

      <!-- 6. PAYMENT -->
      <div style="margin-bottom:16px">
        <div class="section-title">6. Payment</div>
        <div class="payment-summary">
          <div>
            <div class="payment-summary-label">Amount Due</div>
            <div class="payment-summary-pkg" id="pay-pkg-label">Select a package above</div>
          </div>
          <div class="payment-summary-amount" id="pay-amount">$—</div>
        </div>
        <div class="info-bar">💳 <b>Pay after submitting.</b> Spots held 24 hours after registration.</div>
        <div class="payment-btns">
          <a id="venmo-btn" href="#" class="pay-btn pay-venmo" target="_blank">
            <svg class="pay-icon" viewBox="0 0 24 24" fill="white"><path d="M19.1 2C19.8 3.2 20.1 4.4 20.1 6c0 4.7-4 10.9-7.3 15.2H5.4L2.5 2.9l6.3-.6 1.5 12c1.4-2.3 3.1-5.9 3.1-8.4 0-1.4-.2-2.3-.6-3.1L19.1 2z"/></svg>
            @Nerdzbrand
          </a>
          <a href="https://cash.app/$Nerdzbrand" class="pay-btn pay-cashapp" target="_blank">
            <svg class="pay-icon" viewBox="0 0 24 24" fill="black"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            $Nerdzbrand
          </a>
        </div>
      </div>

      <button class="submit-btn" onclick="submitForm()">REGISTER NOW</button>
    `;
  }

  function selectPkg(i) {
    selectedPkg = i;
    document.querySelectorAll(".pkg-card").forEach((c, idx) => c.classList.toggle("selected", idx === i));
    const pkg = PACKAGES[i];
    const el = document.getElementById("pay-amount");
    const lbl = document.getElementById("pay-pkg-label");
    if (el) el.textContent = "$" + pkg.price;
    if (lbl) lbl.textContent = pkg.name;
    const note = encodeURIComponent("HoopNerdz Academy Training");
    const vb = document.getElementById("venmo-btn");
    if (vb) vb.href = `https://venmo.com/Nerdzbrand?txn=pay&amount=${pkg.price}&note=${note}`;
    document.getElementById("success-venmo").href = `https://venmo.com/Nerdzbrand?txn=pay&amount=${pkg.price}&note=${note}`;
  }

  function selectLevel(lvl) {
    selectedLevel = lvl;
    selectedSlot = null;
    ["Beginner","Intermediate","Advanced"].forEach(l => {
      document.getElementById("lvl-" + l)?.classList.remove("selected-beg","selected-int","selected-adv");
    });
    const map = { Beginner: "selected-beg", Intermediate: "selected-int", Advanced: "selected-adv" };
    document.getElementById("lvl-" + lvl)?.classList.add(map[lvl]);

    // Show schedule preview
    const preview = document.getElementById("level-schedule-preview");
    const clsMap = { Beginner: "level-schedule-beg", Intermediate: "level-schedule-int", Advanced: "level-schedule-adv" };
    if (preview) {
      preview.style.display = "block";
      preview.innerHTML = `<div class="level-schedule ${clsMap[lvl]}" style="white-space:pre-line">${LEVEL_SCHEDULE_TEXT[lvl]}</div>`;
    }

    // Render slots for this level
    renderSlots(lvl);
    const section = document.getElementById("slot-section");
    if (section) section.classList.add("visible");
    const title = document.getElementById("slot-section-title");
    if (title) title.textContent = `3. Pick Your Session (${lvl})`;
  }

  function renderSlots(lvl) {
    const slots = LEVEL_SLOTS[lvl] || [];
    const daySlots = slots.filter(s => s.type === "Day Session");
    const lateSlots = slots.filter(s => s.type === "Late Session");

    function slotHTML(s) {
      const status = getSlotStatus(s.key);
      const count = slotCount(s.key);
      const avail = MAX_PER_SLOT - count;
      const unavailable = status === "full" || status === "closed";
      const statusLabels = {
        open: `<span class="slot-status status-open">${avail} spots open</span>`,
        warn: `<span class="slot-status status-warn">${avail} spot${avail !== 1 ? "s" : ""} left</span>`,
        full: `<span class="slot-status status-full">Full</span>`,
        closed: `<span class="slot-status status-closed">Unavailable</span>`,
      };
      const safeKey = s.key.replace(/[|:–]/g,"_");
      return `<div class="slot-option ${unavailable ? "unavailable" : "available"}" id="slot-${safeKey}"
        ${!unavailable ? `onclick="selectSlot('${s.key}', '${safeKey}')"` : ""}>
        <div>
          <div class="slot-label">${s.label}</div>
          <div class="slot-day">${s.type} · ${s.day}</div>
        </div>
        ${statusLabels[status] || ""}
      </div>`;
    }

    const dEl = document.getElementById("day-slots");
    const lEl = document.getElementById("late-slots");
    if (dEl) dEl.innerHTML = daySlots.map(slotHTML).join("");
    if (lEl) lEl.innerHTML = lateSlots.map(slotHTML).join("");
  }

  function selectSlot(key, safeKey) {
    selectedSlot = key;
    document.querySelectorAll(".slot-option.available").forEach(e => e.classList.remove("selected"));
    document.getElementById("slot-" + safeKey)?.classList.add("selected");
  }

  function validate() {
    let ok = true;
    [{ id: "f-first", err: "err-first" }, { id: "f-last", err: "err-last" },
     { id: "f-age", err: "err-age" }, { id: "f-parent", err: "err-parent" }, { id: "f-phone", err: "err-phone" }]
      .forEach(({ id, err }) => {
        const el = document.getElementById(id);
        const msg = document.getElementById(err);
        if (!el?.value.trim()) { el?.classList.add("error"); if (msg) msg.style.display = "block"; ok = false; }
        else { el?.classList.remove("error"); if (msg) msg.style.display = "none"; }
      });
    if (selectedPkg === null) { alert("Please choose a package."); ok = false; }
    if (!selectedLevel) { alert("Please select a skill level."); ok = false; }
    if (!selectedSlot) { alert("Please select a session time."); ok = false; }
    return ok;
  }

  function submitForm() {
    if (!validate()) return;
    const pkg = PACKAGES[selectedPkg];
    const player = {
      id: Date.now(),
      name: document.getElementById("f-first").value.trim() + " " + document.getElementById("f-last").value.trim(),
      age: document.getElementById("f-age").value.trim(),
      level: selectedLevel,
      package: selectedPkg,
      sessionsRemaining: pkg.sessions,
      sessionsAttended: 0,
      notes: [
        document.getElementById("f-notes").value,
        "Parent: " + document.getElementById("f-parent").value.trim(),
        "Phone: " + document.getElementById("f-phone").value.trim(),
        document.getElementById("f-email").value ? "Email: " + document.getElementById("f-email").value.trim() : "",
        document.getElementById("f-school").value ? "School: " + document.getElementById("f-school").value.trim() : "",
        "Slot: " + selectedSlot.replace(/\|/g," · "),
      ].filter(Boolean).join(" | "),
      joinDate: new Date().toISOString(),
      preferredSlot: selectedSlot,
      parentName: document.getElementById("f-parent").value.trim(),
      parentPhone: document.getElementById("f-phone").value.trim(),
      status: "pending_payment",
    };
    const existing = JSON.parse(localStorage.getItem("hn_players") || "[]");
    existing.push(player);
    localStorage.setItem("hn_players", JSON.stringify(existing));
    showSuccess(player, pkg);
  }

  function showSuccess(player, pkg) {
    document.getElementById("main-container").style.display = "none";
    const screen = document.getElementById("success-screen");
    screen.style.display = "block";
    document.getElementById("success-summary").innerHTML = `
      <div class="success-row"><span class="success-row-label">Player</span><span class="success-row-val">${player.name}</span></div>
      <div class="success-row"><span class="success-row-label">Age</span><span class="success-row-val">${player.age}</span></div>
      <div class="success-row"><span class="success-row-label">Level</span><span class="success-row-val"><span class="badge badge-${player.level.toLowerCase()}">${player.level}</span></span></div>
      <div class="success-row"><span class="success-row-label">Package</span><span class="success-row-val">${pkg.name} — $${pkg.price}</span></div>
      <div class="success-row"><span class="success-row-label">Session</span><span class="success-row-val">${player.preferredSlot.replace(/\|/g," · ")}</span></div>
    `;
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  renderPage();
</script>
</body>
</html>
