<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave Your Mark Foundation</title>
<meta name="description" content="Access. Mentorship. Legacy. Donate, apply for a scholarship, volunteer, or connect with Leave Your Mark Foundation.">
<link rel="apple-touch-icon" href="lym-icon-donate.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0A0A0A;
    --white:#FFFFFF;
    --gold:#A8892A;
    --gold-light:#C4A03A;
    --gold-pale:#F5EDD6;
    --gray:#8A8A8A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--black);
    color:var(--white);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:56px 24px 40px;
  }

  .mark-wrap{
    position:relative;
    width:96px;height:96px;
    margin-bottom:20px;
    display:flex;align-items:center;justify-content:center;
  }
  .mark-ring{
    position:absolute;inset:0;
    border-radius:50%;
    border:1px solid var(--gold);
    opacity:0;
    animation:ringOut 2.2s ease-out infinite;
  }
  .mark-ring.delay{animation-delay:1.1s;}
  @keyframes ringOut{
    0%{transform:scale(0.7);opacity:0.6;}
    100%{transform:scale(1.6);opacity:0;}
  }
  .mark-img{
    width:64px;height:auto;
    position:relative;z-index:1;
    opacity:0;
    animation:markIn .7s ease forwards .15s;
  }
  @keyframes markIn{to{opacity:1;}}

  .org-name{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:800;
    font-size:26px;
    letter-spacing:0.02em;
    text-transform:uppercase;
    text-align:center;
    line-height:1.05;
  }
  .org-name span{color:var(--gold);}

  .tagline{
    font-size:13px;
    color:var(--gray);
    text-align:center;
    margin-top:10px;
    letter-spacing:0.02em;
  }

  .divider{
    width:36px;height:2px;background:var(--gold);
    margin:24px 0 28px;
  }

  .links{
    width:100%;
    max-width:400px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .link-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:18px 20px;
    border-radius:6px;
    text-decoration:none;
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:16px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    transition:transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .link-card:active{transform:scale(0.98);}

  .link-primary{
    background:var(--gold);
    color:var(--black);
  }
  .link-primary:hover{background:var(--gold-light);}

  .link-secondary{
    background:transparent;
    border:1.5px solid rgba(255,255,255,0.22);
    color:var(--white);
  }
  .link-secondary:hover{border-color:var(--gold);color:var(--gold-light);}

  .link-arrow{font-size:18px;opacity:0.7;}

  .impact-line{
    margin-top:36px;
    font-size:12px;
    color:var(--gray);
    text-align:center;
    max-width:320px;
    line-height:1.6;
  }

  .footer{
    margin-top:auto;
    padding-top:44px;
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:#555;
    text-align:center;
  }
</style>
</head>
